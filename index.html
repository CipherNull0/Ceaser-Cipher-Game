<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ceaser Cipher Game </title>
    <style>
        :root {
            --purple: #5c438d;
            --pruple-dark: #3e2b68;
            --lavender: #eee7ff;
            --pink: #f8d9f8;
            --pink-dark: #d78ab2;
            --ink: #38284f;
            --white: #fffaff;
            --green: #247547;
            --red: #a52e4a;
        }
        * {box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background: linear-gradient(135deg, #fff5fb, #eee8ff);
        }

        .container {max-width: 1050px; margin: 0 auto;}

        header {
            text-align: center;
            padding: 26px 18px;
            color: white;
            background: linear-gradient(135deg, var(--purple-dark), #7957ad);
            border-radius: 22px;
            box-shadow: 0 8px 22px #5c438d2b;
            margin-bottom: 22px;
        }

        header h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3.2rem); }
        header p { margin: 0; font-size: 1.0rem; color: #f2eaff; }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .stat, panel {
            border: 1px solid #d9caff;
            border-radius: 16px;
            background: #ffffffb8;
            box-shadow: 0 4px 12px #5c438d0d;
        }

        .stat { text-align: center; padding: 15px 8px; background: #e9e0ff; }
        .stat-label { display: block; font-size: 1rem; margin-bottom: 5px; }
        .stat strong { font-size: 1.8rem; color: var(--purple-dark); }

        .panel { padding: 20px; margin-bottom: 18px;}
        h2 { text-align: center; margin: 0 0 15px; color: #7551a9;}

        .alphabet {
            display: grid;
            grid-template-columns: repeat(13, minmax(0, 1fr));
            gap: 8px;
        }


        .letter {
            border: 1px solid #d2c1f3;
            border-radius: 9px;
            padding: 9px 2px;
            text-align: center;
            font-family: Ariel, sans-serif;
            font-size: 1rem;
            font-weight: bold;
            background: #fbf8ff;
            color: var(--purple);
        }

        .cipher {
            text-align: center;
            font-family: "Courier New", monospace;
            font-weight: bold;
            letter-spacing: 4px;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            overflow-wrap: anywhere;
            background: #f4e5ff;
            border: 1px solid #d7b9ff;
            border-radius: 12px;
            padding: 18px 12px;
            margin: 12px auto 20px;
            max-width: 720px;
        }

        label { display: block; text-align: center; font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; }

        input {
            display: block;
            width: min(100%, 720px);
            margin: 0 auto;
            padding: 14px 16px;
            border: 2px solid #cbb8ff;
            border-radius: 10px;
            font-size: 1rem;
            color: var(--ink);
        }
